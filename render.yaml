services:
  - type: web
    name: zera-hub
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    disk:
      name: zera-hub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: FRONTEND_URL
        value: https://zera-hub0.vercel.app
      - key: CLIENT_URL
        value: https://zera-hub0.vercel.app
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: PASSWORD_RESET_FROM
        sync: false
