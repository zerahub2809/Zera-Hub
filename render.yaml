services:
  - type: web
    name: zera-hub
    runtime: node
    buildCommand: npm install && node --check server/index.js && node --check server/services/gmailOAuth.js && npm run build
    startCommand: npm run server
    disk:
      name: zera-hub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: FRONTEND_URL
        value: https://zera-hub0.vercel.app
      - key: CLIENT_URL
        value: https://zera-hub0.vercel.app
      - key: GMAIL_OAUTH_REDIRECT_URI
        value: https://zera-hub-api.onrender.com/api/auth/gmail/callback
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_OAUTH_SETUP_KEY
        sync: false
